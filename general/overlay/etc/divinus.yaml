system:
  sensor_config: /etc/sensors/imx462_imx462_default.json
  web_port: 80
  web_enable_auth: false
  isp_thread_stack_size: 16384
  venc_stream_thread_stack_size: 16384
  web_server_thread_stack_size: 65536
  time_format: "%Y-%m-%d %H:%M:%S"
  watchdog: 30

isp:
  mirror: false
  flip: false
  antiflicker: 60

osd:
  enable: false

mdns:
  enable: false

rtsp:
  enable: false

stream:
  enable: true
  udp_srcport: 5600
  dest:
    - udp://169.254.100.2:5600

mp4:
  enable: true
  codec: H265
  mode: CBR
  width: 1920
  height: 1080
  fps: 60
  gop: 60
  bitrate: 2400
  profile: 2

jpeg:
  enable: false

mjpeg:
  enable: false
